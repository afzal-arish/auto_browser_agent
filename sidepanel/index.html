<!doctype html>
<html>
<head><meta charset="utf-8"><title>Auto Browser Agent</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header><h1>Auto Browser Agent</h1><span id="status">Idle</span></header>
  <label>Groq API key</label>
  <input id="key" type="password" placeholder="gsk_..." autocomplete="off">
  <small>Your key is stored only in Chrome extension storage.</small>
  <label>Task</label>
  <textarea id="goal" placeholder="Example: open the search box and search for Java Spring Boot"></textarea>
  <div class="row"><button id="start">Start</button><button id="stop" disabled>Stop</button></div>
  <div id="log"></div>
  <script src="app.js"></script>
</body>
</html>
